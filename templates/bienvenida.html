<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión Escolar - Inicio</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            text-align: center;
            padding: 8vh 20px;
            color: #333333;
            margin: 0;
        }
        .header-container {
            margin-bottom: 30px;
        }
        h1 { 
            color: #cc0000; /* Rojo institucional */
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p { 
            font-size: 1.1rem; 
            color: #666666;
            margin-top: 5px;
        }
        .student-name {
            font-weight: bold;
            color: #444;
        }
        .botones { 
            margin-top: 40px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .btn {
            display: inline-block;
            padding: 14px 24px;
            width: 320px;
            background-color: #cc0000; /* Rojo principal */
            color: white;
            text-decoration: none;
            border-radius: 4px; /* Bordes menos redondeados, más formales */
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
            border: none;
        }
        .btn:hover { 
            background-color: #990000; 
        }
        .btn-admin { 
            background-color: #4a4a4a; /* Gris grafito */
            margin-top: 25px;
        }
        .btn-admin:hover { 
            background-color: #2b2b2b; 
        }
        hr {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            width: 60%;
            max-width: 600px;
            margin: 30px auto;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>Gestión Escolar</h1>
        <p>Proyecto 10 - Desarrollo Backend</p>
        <p class="student-name">Jorge Faundez</p>
    </div>
    
    <hr>

    <div class="botones">
        <a href="/api/docentes/" class="btn">Lista de Docentes (Público)</a>
        
        {% if user.is_authenticated %}
            <a href="/api/alumnos/" class="btn">Gestión de Alumnos (Privado)</a>
            <a href="/api/registros/indicadores/" class="btn">Indicadores de Gestión</a>
            <a href="/admin/" class="btn btn-admin">Panel de Administración ({{ user.username }})</a>
        {% else %}
            <a href="/admin/" class="btn btn-admin">Iniciar Sesión para Administrar</a>
        {% endif %}
    </div>
</body>
</html>
