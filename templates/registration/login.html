<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Gestión Escolar</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h2>Acceso al Sistema</h2>
    <div style="border: 1px solid #ccc; padding: 20px; width: 300px; margin: 0 auto; border-radius: 8px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #d9232d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                Iniciar Sesión
            </button>
        </form>
    </div>
</body>
</html>
